name: Build Windows Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full test suite
        run: python -m pytest -q

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build application with PyInstaller
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name CoordinateConverterPro `
            --icon resources/icon.ico `
            app.py

      - name: Verify EXE exists
        shell: pwsh
        run: |
          $exe = "dist\CoordinateConverterPro\CoordinateConverterPro.exe"

          if (-not (Test-Path $exe)) {
            Write-Error "EXE was not created: $exe"
            exit 1
          }

          Write-Host "EXE successfully created:"
          Get-Item $exe

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist\CoordinateConverterPro\*" `
            -DestinationPath "CoordinateConverterPro-Windows.zip" `
            -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: CoordinateConverterPro-Windows
          path: CoordinateConverterPro-Windows.zip
          if-no-files-found: error
