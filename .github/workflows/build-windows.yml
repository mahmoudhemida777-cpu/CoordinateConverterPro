name: Build Windows Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install test dependencies and icon tooling
        run: python -m pip install pytest pillow

      - name: Run full test suite
        run: python -m pytest -q

      - name: Generate MH - Coordinate branded Windows icon
        run: python tools/generate_icon.py

      - name: Install PyInstaller
        run: python -m pip install -U pyinstaller

      - name: Build MH - Coordinate - standalone EXE
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name MH_Coordinate `
            --icon resources/icon.ico `
            app.py

      - name: Verify standalone EXE exists
        shell: pwsh
        run: |
          $exe = "dist\MH_Coordinate.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Standalone EXE was not created: $exe"
            exit 1
          }
          Write-Host "MH - Coordinate standalone EXE successfully created:"
          Get-Item $exe

      - name: Smoke test frozen EXE imports
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist\MH_Coordinate.exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -PassThru -Wait
          if ($p.ExitCode -ne 0) {
            Write-Error "Frozen EXE smoke test failed with exit code $($p.ExitCode)"
            exit 1
          }
          Write-Host "Frozen EXE smoke test passed. Critical modules loaded successfully."

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist\MH_Coordinate.exe" `
            -DestinationPath "MH_Coordinate-Windows.zip" `
            -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: MH-Coordinate-Windows
          path: MH_Coordinate-Windows.zip
          if-no-files-found: error

      - name: Publish rolling Latest release for automatic updates
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path "core\version.py" -Pattern 'APP_VERSION\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "0.0.0" }

          gh release view latest 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create latest --target main --title "MH - Coordinate v$version" --notes "Rolling release used by the in-app automatic updater."
          } else {
            gh release edit latest --title "MH - Coordinate v$version" --notes "Rolling release used by the in-app automatic updater."
          }

          gh release delete-asset latest "MH_Coordinate-Windows.zip" --yes 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No previous rolling Windows asset to delete."
          }

          gh release upload latest "MH_Coordinate-Windows.zip"

      # Release pipeline intentionally runs the full suite before freezing the EXE.
      # This keeps the downloadable Windows build tied to a tested main commit.
