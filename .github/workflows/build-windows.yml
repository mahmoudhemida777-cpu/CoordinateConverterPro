name: Build Windows Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Run full test suite
        run: python -m pytest -q

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build MH GeoSuite Pro
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name MH_GeoSuite_Pro `
            --icon resources/icon.ico `
            app.py

      - name: Verify EXE exists
        shell: pwsh
        run: |
          $exe = "dist\MH_GeoSuite_Pro\MH_GeoSuite_Pro.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "EXE was not created: $exe"
            exit 1
          }
          Write-Host "MH GeoSuite Pro EXE successfully created:"
          Get-Item $exe

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist\MH_GeoSuite_Pro\*" `
            -DestinationPath "MH_GeoSuite_Pro-Windows.zip" `
            -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: MH-GeoSuite-Pro-Windows
          path: MH_GeoSuite_Pro-Windows.zip
          if-no-files-found: error
