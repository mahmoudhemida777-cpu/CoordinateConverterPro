name: Build Windows Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full test suite
        run: python -m pytest -q

      - name: Build application with PyInstaller
        run: >
          pyinstaller
          --noconfirm
          --clean
          --windowed
          --name CoordinateConverterPro
          --icon resources/icon.ico
          app.py

      - name: Verify EXE exists
        shell: pwsh
        run: |
          $exe = "dist\CoordinateConverterPro\CoordinateConverterPro.exe"

          if (-not (Test-Path $exe)) {
            Write-Error "EXE was not created: $exe"
            exit 1
          }

          Write-Host "EXE successfully created:"
          Get-Item $exe

      - name: Run Windows smoke test
        run: >
          python scripts/windows_smoke_test.py
          --exe-dir dist/CoordinateConverterPro
          --startup-wait-seconds 6

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist\CoordinateConverterPro\*" `
            -DestinationPath "CoordinateConverterPro-Windows.zip" `
            -Force

     name: Build Windows Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path "requirements.txt") {
            python -m pip install -r requirements.txt
          }

          python -m pip install pyinstaller

      - name: Run tests
        run: python -m pytest -q

      - name: Build Windows executable
        shell: pwsh
        run: |
          if (Test-Path "app.py") {
            python -m PyInstaller --noconfirm --clean --onefile --windowed --name CoordinateConverterPro app.py
          }
          elseif (Test-Path "main.py") {
            python -m PyInstaller --noconfirm --clean --onefile --windowed --name CoordinateConverterPro main.py
          }
          else {
            Write-Error "Could not find app.py or main.py"
          }

      - name: Verify build
        shell: pwsh
        run: |
          if (!(Test-Path "dist/CoordinateConverterPro.exe")) {
            Write-Error "Build failed: EXE was not created."
          }

          Get-Item "dist/CoordinateConverterPro.exe"

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v7
        with:
          name: CoordinateConverterPro-Windows
          path: dist/CoordinateConverterPro.exe
          if-no-files-found: error
          files: |
            CoordinateConverterPro-Windows.zip
            installer/Output/CoordinateConverterPro_Setup.exe
          generate_release_notes: true
