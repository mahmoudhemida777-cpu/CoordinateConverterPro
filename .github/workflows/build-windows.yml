name: Build Windows Release
on:
  push:
    branches:
      - release/final-stable-fix
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pip install pytest
      - name: Run full test suite
        run: python -m pytest -q
      - run: python -m pip install -U pyinstaller
      - name: Build standalone EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name MH_Coordinate --icon resources/icon.ico app.py
      - name: Verify EXE
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\MH_Coordinate.exe")) { throw "EXE was not created" }
      - name: Smoke test frozen EXE
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path "dist\MH_Coordinate.exe") -ArgumentList "--smoke-test" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Frozen EXE smoke test failed: $($p.ExitCode)" }
      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path "dist\MH_Coordinate.exe" -DestinationPath "MH_Coordinate-Windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: MH-Coordinate-Windows-Final
          path: MH_Coordinate-Windows.zip
          if-no-files-found: error
